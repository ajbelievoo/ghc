# Add this to /www/server/panel/vhost/nginx/ghc.believoo.com.conf
# Then restart nginx: /www/server/nginx/sbin/nginx -s reload

server {
    listen 80;
    server_name ghc.believoo.com;

    # Cloudflare flexible SSL redirect (optional)
    if ($server_port !~ 443) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    server_name ghc.believoo.com;

    # SSL certificate paths (update to your actual aaPanel SSL paths)
    ssl_certificate /www/server/panel/vhost/cert/ghc.believoo.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ghc.believoo.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
