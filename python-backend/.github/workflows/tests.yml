name: GHC Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ghc_test
          POSTGRES_PASSWORD: ghc_test
          POSTGRES_DB: ghc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ tests/ || true

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://ghc_test:ghc_test@localhost:5432/ghc_test
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'ci-admin-password' }}
        run: |
          python -m alembic upgrade head

      - name: Test with pytest
        env:
          DATABASE_URL: postgresql://ghc_test:ghc_test@localhost:5432/ghc_test
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'ci-admin-password' }}
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -q || true

      - name: Security audit
        run: |
          pip install pip-audit
          pip-audit || true
